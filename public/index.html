<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>makro distribuce – online registrace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002f6c;
    --navy-deep:#003a78;
    --yellow:#ffe500;
    --blue:#0463e0;
    --blue-soft:#dbe8fb;
    --blue-link:#0a3d91;
    --ink:#3a3a3c;
    --ink-strong:#1f1f21;
    --muted:#6b6f76;
    --line:#d5d8dd;
    --panel:#f5f5f5;
    --info:#f0f3fb;
    --ok:#1a8a5a;
    --ok-bg:#e8f5ee;
    --ok-line:#7cc4a0;
    --ok-panel:#d6ead4;
    --err:#d6283a;
    --err-bg:#fdecee;
    --warn-bg:#fff4ec;
    --warn-line:#f0a060;
    --disabled:#d3d3d3;
    --disabled-ink:#7b7b7b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fff;font-size:14px;line-height:1.4}
  button{font:inherit;cursor:pointer}
  a{color:var(--blue-link)}

  /* header */
  .hdr{background:var(--navy);height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,5vw,96px)}
  .brand{display:flex;align-items:center;gap:12px;color:#fff;font-size:22px;font-weight:500}
  .logo{font-size:38px;font-weight:800;letter-spacing:-1.5px;color:var(--yellow);line-height:1}
  .hdr-actions{display:flex;align-items:center;gap:28px;color:#fff;font-size:14px;font-weight:600}
  .hdr-actions .login{display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;font-weight:600}
  .btn-reg{background:var(--blue);color:#fff;border:0;padding:9px 12px;font-weight:600;font-size:14px}
  .avatar{width:40px;height:40px;border-radius:50%;background:#e9e9ea;color:var(--ink);display:grid;place-items:center;font-weight:600;font-size:13px}

  /* layout */
  .page{max-width:1128px;margin:72px auto 80px;display:grid;grid-template-columns:280px minmax(0,800px);gap:40px;padding:0 16px}
  .steps{display:flex;flex-direction:column;gap:4px;align-self:start}
  .step{display:flex;gap:12px;padding:10px;align-items:center;transition:background-color .15s ease;width:100%}
  .step.active{background:#f3f5fe}
  .step.active:hover{background:#eaedf8}
  button.step{border:0;background:none;font:inherit;text-align:left;color:inherit;cursor:pointer}
  button.step:hover{background:#f6f6f6}
  button.step:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  .step .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .step .dot{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--muted);background:#fff}
  .step.active .dot{background:var(--blue);border-color:var(--blue);color:#fff}
  .step.done .dot{background:var(--blue);border-color:var(--blue);color:#fff}
  .step b{display:block;font-size:14px;font-weight:600;color:var(--ink-strong)}
  .step span{display:block;font-size:12px;color:var(--muted)}

  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:28px;font-size:13px}
  .iconbtn{width:32px;height:32px;border-radius:50%;border:0;background:#efeff0;display:grid;place-items:center;color:var(--ink-strong)}
  .topbar .grow{flex:1}
  .saved{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
  .saved::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
  b,strong,h1,h2,h3{font-weight:600}
  h1{font-size:28px;line-height:32px;margin:0 0 8px;color:#444}
  .sub{margin:0 0 24px;font-size:14px}
  h3{font-size:16px;margin:0 0 6px;color:var(--ink-strong)}
  .lbl{font-weight:600;font-size:13px;color:var(--ink-strong);margin:0 0 6px;display:block}

  /* alerts */
  .alert{--c:var(--ok);--bg:var(--ok-bg);display:flex;gap:12px;align-items:flex-start;padding:14px 16px 14px 14px;margin-bottom:20px;
    background:var(--bg);border-left:4px solid var(--c);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent);
    box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent);border-left-width:4px;
    font-size:14px;line-height:1.45;color:var(--ink-strong);animation:alertIn .3s ease both}
  .alert.ok{--c:#1a8a5a;--bg:#eef7f2}
  .alert.err{--c:#d6283a;--bg:#fdf0f1}
  .alert.warn{--c:#c26a00;--bg:#fff6ea}
  .alert svg{flex:none;width:20px;height:20px;margin-top:1px;color:var(--c)}
  .alert p{margin:0}
  @keyframes alertIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.alert{animation:none}}

  /* panels */
  .panel{background:var(--panel);padding:20px;display:flex;gap:20px;margin-bottom:24px}
  .panel.green{background:var(--ok-panel);align-items:flex-start;position:relative}
  .panel .badge{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--navy);font-size:18px}
  dl{display:grid;grid-template-columns:130px 1fr;gap:10px 0;margin:0;font-size:13px;flex:1}
  dt{color:var(--ink)} dd{margin:0;font-weight:600;color:var(--ink-strong)}
  .info{background:var(--info);padding:12px;margin-bottom:8px;font-size:13px}
  .info .tag{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#c5d6f2;color:var(--navy);font-size:9px;font-weight:700;margin-right:10px}
  .info ul{margin:6px 0 0 26px;padding-left:12px}
  .bigcheck{position:absolute;right:20px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:#0a8a0a;color:#fff;display:grid;place-items:center;font-size:15px}

  /* buttons */
  .actions{display:flex;align-items:center;gap:28px;margin-top:48px}
  .btn{background:var(--blue);color:#fff;border:0;padding:12px;font-weight:600;font-size:13px}
  .btn:disabled{background:var(--disabled);color:var(--disabled-ink);cursor:not-allowed}
  .btn.soft{background:var(--blue-soft);color:var(--blue-link)}
  .btn.sm{padding:7px 10px;font-size:12px}
  .link{background:none;border:0;color:var(--blue);font-weight:600;font-size:13px;padding:0}
  .link.small{font-size:12px}

  /* inputs */
  .field{display:flex;align-items:center;border:1px solid var(--line);background:#fff;height:44px;padding:0 12px;width:100%}
  .field input{border:0;outline:0;font:inherit;flex:1;min-width:0;background:transparent;color:var(--ink-strong)}
  .field:focus-within{border-color:var(--blue)}
  .field.err{border-color:var(--err)}
  .ico-row{display:flex;gap:6px;align-items:center}
  .ico-row .field{width:248px}
  .clear{background:none;border:0;font-size:16px;color:var(--ink-strong)}
  .stack{max-width:600px}
  .phone-row{display:flex;gap:10px;align-items:flex-end;margin-top:20px}
  .prefix{width:100px}
  .prefix .field{justify-content:space-between;padding:0 10px}
  .flag{width:20px;height:13px;display:inline-block;margin-right:6px;vertical-align:-2px;box-shadow:0 0 0 1px #d5d8dd}
  .field.small-w{width:160px}

  /* loading */
  .loading{background:var(--panel);height:240px;display:grid;place-items:center}
  .dots{display:flex;gap:10px;align-items:center}
  .dots i{display:block;width:20px;height:20px;border-radius:10px;background:#fff;animation:pulse 1.2s infinite ease-in-out}
  .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{width:20px;opacity:.6}40%{width:20px;opacity:1}}
  .dots i{box-shadow:0 0 0 1px #ececec}

  /* bank */
  .banks{background:var(--panel);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .bank{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid transparent;padding:10px;min-height:74px;text-align:left;width:100%;box-shadow:0 2px 4px rgba(0,0,0,.06),0 0 4px rgba(0,0,0,.06)}
  .bank:hover{box-shadow:0 2px 8px rgba(0,0,0,.12),0 0 4px rgba(0,0,0,.08)}
  .bank.sel{border-color:#005ae0}
  .bank .lg{width:50px;height:50px;flex:none;background:#fff;display:grid;place-items:center;overflow:hidden}
  .bank .lg img{width:100%;height:100%;object-fit:contain;display:block}
  .bank .name{flex:1;color:#444;font-size:16px;font-weight:600;line-height:20px}
  .radio{width:24px;height:24px;border-radius:50%;border:2px solid #b9b9bd;flex:none;display:grid;place-items:center;margin-right:14px}
  .bank.sel .radio{background:#3a3a3c;border-color:#3a3a3c}
  .bank.sel .radio::after{content:"✓";color:#fff;font-size:13px}
  .toggle{grid-column:1/-1;background:none;border:0;color:var(--blue-link);font-weight:600;font-size:12px;text-align:left;padding:8px 4px 4px}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:16px 0 0}
  .chk input{appearance:none;width:16px;height:16px;border:1.5px solid #b9b9bd;border-radius:3px;margin:1px 0 0;flex:none;display:grid;place-items:center;background:#fff;cursor:pointer}
  .chk input:checked{background:#3a3a3c;border-color:#3a3a3c}
  .chk input:checked::after{content:"✓";color:#fff;font-size:11px}

  /* poa */
  .role{display:inline-block;background:#ffd84d;color:#3d2f00;font-weight:600;font-size:11px;padding:2px 6px}
  .drop{border:1px dashed #b9c4d6;background:#fff;display:flex;align-items:center;gap:16px;padding:18px 16px;margin-top:12px}
  .drop.over{border-color:var(--blue);background:#f4f8ff}
  .drop .up{color:var(--blue);font-size:30px;line-height:1}
  .drop .t{flex:1} .drop .t b{font-weight:500;display:block;font-size:13px} .drop .t small{font-size:11px;color:var(--muted)}
  .file{display:flex;align-items:center;gap:10px;background:#fff;padding:12px 14px;margin-top:12px;font-size:12px}
  .file .sz{margin-left:auto;font-size:11px;color:var(--muted)}
  .file .fi{color:var(--blue);font-size:16px}
  .rolecell{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .hint{font-size:13px;margin:0}

  /* modal */
  .modal-wrap{min-height:calc(100vh);display:grid;place-items:center;background:#fff}
  .modal{width:340px;border:1px solid #e1e1e1;box-shadow:0 4px 18px rgba(0,0,0,.14);padding:24px 28px 20px;text-align:center;position:relative;background:#fff}
  .modal .x{position:absolute;right:12px;top:12px;background:none;border:0;font-size:18px}
  .modal .mlogo{display:inline-block;background:var(--navy);padding:6px 16px;font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--yellow)}
  .modal h2{margin:12px 0 4px;font-size:18px;color:#47474a}
  .modal p{margin:0 0 14px;font-size:11.5px}
  .social{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
  .social button{width:62px;height:40px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;padding:0}
  .social button:hover{border-color:#9aa3b0;background:#fafafa}
  .social svg{width:20px;height:20px;display:block}
  .modal .how{display:block;text-align:right;font-size:11px;margin-bottom:12px}
  .or{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--muted);margin-bottom:14px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .btn-wide{width:100%;background:#0a3f78;color:#fff;border:0;border-radius:3px;padding:11px;font-weight:600;font-size:12px}
  .modal .have{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;font-size:13px}
  .email-form{text-align:left;display:flex;flex-direction:column;gap:10px;margin-bottom:6px}

  /* misc */
  .center-note{max-width:520px;margin:0 auto;padding-top:60px;text-align:center}
  .invite-add{margin-top:10px}
  .terms{margin-top:24px}
  .phone{display:flex;align-items:center;gap:10px;margin:20px 0 0;font-weight:600;color:var(--navy)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2b2d;color:#fff;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}

  /* landing page */
  .lp{background:#fafafa;display:flow-root}
  .lp-wrap{max-width:1536px;margin:0 auto;padding:0 clamp(16px,5.5vw,96px)}
  .lp-pill{display:inline-flex;align-items:center;justify-content:center;border-radius:0;padding:16px 28px;font-size:15px;font-weight:700;line-height:1.2;border:2px solid transparent;color:#fff;text-decoration:none;white-space:nowrap}
  .lp-pill.primary{background:#005ae0}
  .lp-pill.primary:hover{background:#0050c8}
  .lp-pill.ghost{border-color:#fff;background:transparent}
  .lp-pill.ghost:hover{background:rgba(255,255,255,.12)}
  .lp-hero{margin-top:32px;position:relative;overflow:hidden;border-radius:0;border-bottom:6px solid var(--yellow);padding:72px;display:flex;flex-direction:column;gap:24px;background:#002d72;isolation:isolate}
  .lp-hero::before{content:"";position:absolute;inset:0;z-index:-3;background:var(--tile) center/cover;opacity:.2}
  .lp-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,45,114,.96) 52.4%,rgba(95,99,104,.33))}
  .lp-hero .truck{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover}
  .lp-eyebrow{margin:0;color:#ffe61c;font-weight:700;font-size:13px;letter-spacing:1.56px}
  .lp-hero h1{margin:0;color:#fff;font-size:60px;line-height:1.04;font-weight:900;letter-spacing:0}
  .lp-hero h1 span{color:#ffee00}
  .lp-hero p.lead{margin:0;max-width:650px;font-size:18px;line-height:1.4;color:rgba(255,255,255,.9)}
  .lp-hero .row{display:flex;gap:16px;flex-wrap:wrap}
  .lp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding-top:56px}
  .lp-stat{border-radius:0;padding:24px 28px;border-left:4px solid var(--accent)}
  .lp-stat b{display:block;font-size:36px;line-height:1.2;font-weight:700}
  .lp-stat span{font-size:13.5px;color:#6b7280}
  .lp-why{padding:72px 0 0}
  .lp-why h2{margin:0 0 40px;text-align:center;font-size:32px;font-weight:700;color:#002d72}
  .lp-why h2::after{content:"";display:block;width:56px;height:5px;background:var(--yellow);margin:16px auto 0}
  .lp-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:start}
  .lp-card{background:#fff;border:1px solid #e5e8ed;border-radius:0;transition:box-shadow .2s,transform .2s;overflow:hidden;padding:0 20px 24px;display:flex;flex-direction:column;gap:14px}
  .lp-card::before{content:"";height:6px;margin:0 -0px;background:var(--bar)}
  .lp-card img{display:block;width:100%;height:150px;object-fit:cover;border-radius:0;margin-top:6px}
  .lp-card:hover{box-shadow:0 8px 24px rgba(0,45,114,.12);transform:translateY(-2px)}
  .lp-card h3{margin:0;font-size:17px;font-weight:600;color:#1a1d29}
  .lp-card p{margin:0;font-size:13.5px;color:#6b7280}
  .lp-cta{margin:56px auto 96px;background:#ffee00;border-radius:0;padding:48px 72px;display:flex;align-items:center;justify-content:space-between;gap:24px;color:#002d72}
  .lp-cta h2{margin:0 0 4px;font-size:24px;font-weight:700;color:#002d72}
  .lp-cta p{margin:0;font-size:14px}
  .lp-foot{background:#f2f4f8;padding:48px 0;color:#002d72;font-size:11px;line-height:16px}
  .lp-foot .cols{display:grid;grid-template-columns:repeat(4,max-content);justify-content:space-between;gap:24px;padding-right:clamp(0px,18vw,320px)}
  .lp-foot b{display:block;margin-bottom:16px}
  .lp-foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  .lp-foot .soc{display:flex;gap:12px;align-items:center;margin-top:0}
  .lp-foot .soc img{display:block;height:24px}
  .lp-foot .copy{margin-top:16px;font-weight:600}
  @media (max-width:1000px){.lp-cards,.lp-stats{grid-template-columns:1fr}.lp-hero{padding:40px 24px}.lp-hero h1{font-size:40px}.lp-cta{flex-direction:column;align-items:flex-start;padding:32px 24px}.lp-foot .cols{grid-template-columns:1fr 1fr;padding-right:0}}

  /* bank website (prototype stand-in) */
  .bsite{min-height:100vh;background:#f3f3f0;color:#222}
  .bsite-bar{background:#fff;border-bottom:1px solid #e3e3df}
  .bsite-wrap{max-width:960px;margin:0 auto;padding:0 24px}
  .bsite-bar .bsite-wrap{display:flex;align-items:center;gap:12px;height:64px}
  .bsite-bar img{width:36px;height:36px;object-fit:contain}
  .bsite-bar b{font-size:16px;font-weight:600}
  .bsite-main{padding-top:56px;padding-bottom:56px}
  .bsite-card{background:#fff;max-width:520px;margin:0 auto;padding:40px 40px 36px;text-align:center;display:flex;flex-direction:column;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .bsite-logo{width:96px;height:96px;object-fit:contain;margin-bottom:20px}
  .bsite-card h1{font-size:26px;line-height:32px;margin:0 0 12px;color:#222}
  .bsite-note{margin:0 0 24px;font-size:14px;line-height:22px;color:#555}
  .bsite-env{background:#feffe6;border:1px dashed #d9d98a;padding:14px 20px;margin-bottom:28px;text-align:left;font-size:14px;width:100%}
  .bsite-env ul{margin:6px 0 0;padding-left:20px}

  /* exit dialog (lightbox) */
  .overlay{position:fixed;inset:0;z-index:100;background:rgba(0,20,48,.6);display:grid;place-items:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s}
  .overlay.open{opacity:1;visibility:visible;transition:opacity .3s ease}
  .dialog{background:#fff;width:100%;max-width:480px;padding:32px;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.3);transform:translateY(8px);transition:transform .3s ease}
  .overlay.open .dialog{transform:none}
  .dialog h2{margin:0 0 12px;font-size:22px;line-height:28px;color:#444;padding-right:32px}
  .dialog p{margin:0;font-size:14px;line-height:22px}
  .dialog .x{position:absolute;right:12px;top:12px;width:32px;height:32px;border:0;background:#efeff0;display:grid;place-items:center;font-size:14px;color:var(--ink-strong)}
  .dialog .actions{margin-top:28px;gap:24px}
  body.noscroll{overflow:hidden}
  @media (prefers-reduced-motion:reduce){.overlay,.dialog{transition:none}.lp-card{transition:none}.lp-card:hover{transform:none}}

  /* screen transitions: 300ms dissolve */
  ::view-transition-old(root),::view-transition-new(root){animation-duration:300ms;animation-timing-function:ease}
  #app.fade{animation:fadeIn 300ms ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* button states: hover, pressed, keyboard focus (disabled buttons stay inert) */
  button{transition:background-color .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease,opacity .15s ease}
  button:focus-visible,a:focus-visible,.field input:focus-visible{outline:2px solid #005ae0;outline-offset:2px}
  .hdr button:focus-visible,.lp-hero button:focus-visible{outline-color:var(--yellow)}
  .field input:focus-visible{outline:0}
  button:disabled{cursor:not-allowed}

  .btn:not(:disabled):hover{background:#004fc4}
  .btn:not(:disabled):active{background:#0043a6}
  .btn.soft:not(:disabled):hover{background:#c8dcf8;color:#062a66}
  .btn.soft:not(:disabled):active{background:#b4cef4}
  .btn-reg:hover{background:#2a7bf0}
  .btn-reg:active{background:#1a6be0}
  .btn-wide:hover{background:#072f5b}
  .btn-wide:active{background:#052346}
  .hdr-actions .login:hover{text-decoration:underline;text-underline-offset:4px}
  .lp-pill.primary:hover{background:#004fc4}
  .lp-pill.primary:active{background:#0043a6}
  .lp-pill.ghost:hover{background:rgba(255,255,255,.16)}
  .lp-pill.ghost:active{background:rgba(255,255,255,.28)}

  .link:hover,.toggle:hover{color:#0043a6;text-decoration:underline;text-underline-offset:3px}
  .link:active,.toggle:active{color:#003380}
  .iconbtn:hover,.dialog .x:hover{background:#e2e2e4}
  .iconbtn:active,.dialog .x:active{background:#d4d4d7}
  .modal .x:hover,.clear:hover{opacity:.6}
  .social button:active{background:#f0f0f0}
  .bank:active{box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .bank:focus-visible{outline-offset:-2px}


  /* ===== desktop defaults for elements that matter on mobile ===== */
  .rail{display:none}
  .dic-row{display:grid;grid-template-columns:130px 1fr;margin-top:10px;align-items:center;font-size:13px}
  .acct-panel{width:480px;align-items:flex-start}
  .invite-field{width:280px;margin-bottom:8px}
  .sheet-ov{display:none}

  /* ===== mobile (<= 768px): layout from Figma "Heading XL" template =====
     header, back button, "Krok X z 5" + numbered rail, content, sticky footer actions.
     Modal dialogs become bottom sheets. Corners stay sharp. */
  @media (max-width:768px){
    body{font-size:14px}
    /* header */
    .hdr{height:64px;padding:0 12px}
    .brand{font-size:26px;font-weight:700;gap:7px}
    .logo{font-size:26px;letter-spacing:-.5px}
    .hdr-actions{gap:12px}
    .hdr-actions .login{display:none}
    .btn-reg{padding:10px 12px;font-size:14px}
    .avatar{width:40px;height:40px}

    /* page: single column, content grows so the footer sits at the bottom */
    .page{display:flex;flex-direction:column;margin:0;padding:12px;min-height:calc(100vh - 64px);min-height:calc(100dvh - 64px);max-width:none}
    .page>.steps{display:none}
    .page>main{display:flex;flex-direction:column;flex:1;min-width:0}

    /* top block: back button, step label + saved, numbered rail */
    .topbar{display:grid;grid-template-columns:1fr auto;gap:12px 8px;align-items:baseline;margin-bottom:24px}
    .topbar .back{grid-column:1/-1;justify-self:start;width:36px;height:36px;background:#f0f0f0}
    .topbar .grow,.topbar .xbtn{display:none}
    .topbar .crumb{font-size:16px;line-height:20px;font-weight:600;color:#444}
    .topbar .saved{font-size:12px;font-weight:500;color:#666}
    .rail{grid-column:1/-1;display:flex;align-items:center;height:32px}
    .rdot{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:#e9e9e9;color:#7c7c7c;border:0;padding:0}
    .rdot.done{background:#005ae0;color:#fff;font-size:14px}
    .rdot.done:hover{background:#004fc4}
    .rdot.current{background:#fff;color:#005ae0;border:2px solid #005ae0;font-weight:700}
    .conn{flex:1;height:2px;background:#e9e9e9;min-width:4px}
    .conn.on{background:#005ae0}

    h1{font-size:24px;line-height:28px;margin:0 0 8px}
    .sub{margin:0 0 12px;line-height:22px}
    .lbl{font-size:14px}
    h3{font-size:15px}

    /* sticky footer actions: primary full width, secondary link as full-width button below */
    .actions{position:sticky;bottom:0;z-index:5;flex-direction:column;align-items:stretch;gap:12px;
      margin:auto -12px 0 !important;padding:12px 12px max(32px,env(safe-area-inset-bottom));background:#fff;box-shadow:0 -1px 0 #ececec}
    .actions .btn{width:100%;min-height:48px;font-size:16px;padding:12px !important}
    .actions .link{min-height:48px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#0047c2}
    main>.cta-intro{width:100%;min-height:48px;font-size:16px}

    /* fields */
    .ico-row{align-items:flex-end}
    .ico-row .field{flex:1;width:auto}
    .ico-row .btn{min-height:48px;font-size:16px !important;padding:12px !important}
    .iconbtn.back{font-size:22px}
    .field{height:48px}
    .stack{max-width:none}
    .prefix{width:119px}
    .dic-row{grid-template-columns:1fr;gap:6px}
    .field.small-w{width:100%}
    .invite-field{width:100%}

    /* data panels: label above value, no leading badge */
    .panel{padding:16px;gap:0}
    .panel .badge{display:none}
    .panel dl{grid-template-columns:1fr;gap:0;font-size:14px}
    .panel dt{margin-top:12px}
    .panel dt:first-child{margin-top:0}
    .panel dd{margin-top:2px}
    .acct-panel{width:100%}
    .panel.green .bigcheck{top:16px;transform:none;right:16px}
    .info{font-size:14px}

    /* bank picker: single column of tiles */
    .banks{grid-template-columns:1fr;padding:12px;gap:12px}
    .bank{min-height:64px}
    .bank .name{font-size:15px}
    .radio{margin-right:6px}

    /* verification method tabs: full-width halves */
    .seg{display:flex;width:100%}
    .seg button{flex:1;min-width:0;height:32px;font-size:13px}
    .docpanel{padding:12px;gap:12px}

    /* power of attorney upload */
    .drop{flex-wrap:wrap;gap:12px}
    .drop .t{flex:1 1 60%}
    .file{flex-wrap:wrap}
    .alert{font-size:14px}

    /* bottom sheets (replace modal dialogs) */
    .overlay{align-items:end;padding:0}
    .dialog{max-width:none;width:100%;padding:28px 16px max(24px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s ease;touch-action:none}
    .overlay.open .dialog{transform:none}
    .dialog::before,.sheet::before{content:"";display:block;width:40px;height:4px;background:#c9ccd1;margin:-16px auto 20px}
    .dialog .x{display:none}
    .dialog h2{padding-right:0;font-size:20px}
    .dialog .actions{position:static;margin:24px 0 0 !important;padding:0;box-shadow:none;gap:8px}
    .dialog .actions .btn{padding:12px !important}

    .sheet-ov{display:flex;align-items:flex-end;position:fixed;inset:0;z-index:90;background:rgba(0,20,48,.6);animation:ovIn .3s ease both}
    .sheet{background:#fff;width:100%;border:0;box-shadow:0 -8px 32px rgba(0,0,0,.25);padding:28px 16px max(24px,env(safe-area-inset-bottom));animation:sheetUp .3s ease both;position:relative}
    .sheet .x{display:none}
    .sheet .btn-wide{padding:14px;font-size:15px}
    .sheet .social button{flex:1;max-width:84px;height:44px}
    @keyframes ovIn{from{opacity:0}to{opacity:1}}
    @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
    @media (prefers-reduced-motion:reduce){.sheet-ov,.sheet{animation:none}.dialog{transition:none}}

    /* bank stand-in page */
    .bsite-main{padding:24px 12px}
    .bsite-card{padding:28px 20px}
    .bsite-bar .bsite-wrap,.bsite-wrap{padding:0 12px}

    /* landing page */
    .lp-wrap{padding:0 12px}
    .lp-hero{margin-top:12px;padding:32px 20px;gap:16px}
    .lp-hero h1{font-size:36px}
    .lp-hero p.lead{font-size:16px}
    .lp-hero .row{flex-direction:column;gap:12px}
    .lp-pill{width:100%}
    .lp-stats{gap:12px;padding-top:24px}
    .lp-why{padding-top:48px}
    .lp-why h2{font-size:26px;margin-bottom:28px}
    .lp-cards{gap:16px}
    .lp-cta{margin:40px auto 48px;padding:28px 20px}
    .lp-foot .cols{grid-template-columns:1fr 1fr}

  }

  /* verification method: segmented control + ID document slots */
  .seg{display:inline-flex;gap:4px;padding:4px;background:#fff;border:1px solid #e9e9e9;margin:16px 0}
  .seg button{height:24px;min-width:120px;padding:0 16px;border:0;background:none;font-size:12px;line-height:16px;color:#222;font-weight:400}
  .seg button:hover{background:#f3f5fe}
  .seg button[aria-selected="true"],.seg button[aria-selected="true"]:hover{background:#005ae0;color:#fff;font-weight:600}
  .docpanel{background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:16px;margin-bottom:16px}
  .slot-h{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
  .slot-h b{font-size:14px;font-weight:600;color:var(--ink-strong)}
  .slot-h span{font-size:12px;color:var(--muted)}
  /* white rows inside the grey card look like the bank tiles: same height, padding and elevation */
  .docpanel .drop,.docpanel .file{margin-top:0;padding:12px;min-height:74px;box-shadow:0 2px 4px rgba(0,0,0,.06),0 0 4px rgba(0,0,0,.06)}
  .docpanel .drop{border:1px dashed #b9c4d6}
  .docpanel .file{border:1px solid transparent;padding:11px}
  .docpanel .file .thumb{width:50px;height:50px}
  .slot-err{margin-top:6px;font-size:12px;color:var(--err)}
  .file .thumb{width:40px;height:40px;object-fit:cover;flex:none;background:#eee}
  .file .fname{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file .sz{margin-left:auto;flex:none}
  .file .link.small{margin-left:12px;flex:none}


  /* ===== Typography theme: "makro.cz" (larger text) =====
     Sizes measured on makro.cz: Lato; UI/body text 16/24, buttons 18/27 bold, small 14, headings 32/41 and 26/33
     (the site uses the proprietary CAMetro for headings; Lato Bold stands in for it here).
     Switch it in "Prototype scenarios" → Typography, or open the page with ?type=makro. */
  html[data-type="makro"] body{font-family:Lato,Inter,system-ui,sans-serif;font-size:16px;line-height:1.5;color:#33435b}
  html[data-type="makro"] button,html[data-type="makro"] input,html[data-type="makro"] select{font-family:inherit}
  html[data-type="makro"] h1,html[data-type="makro"] h2,html[data-type="makro"] h3{color:#002d72;font-weight:700}
  html[data-type="makro"] h1{font-size:32px;line-height:41px;margin-bottom:12px}
  html[data-type="makro"] h3{font-size:20px;line-height:28px}
  html[data-type="makro"] h3[style*="font-size"]{font-size:16px !important;line-height:24px}
  html[data-type="makro"] dl{grid-template-columns:180px 1fr}
  html[data-type="makro"] .sub,html[data-type="makro"] .hint,html[data-type="makro"] p{font-size:16px;line-height:24px}
  html[data-type="makro"] .hint{font-size:15px}
  html[data-type="makro"] b,html[data-type="makro"] strong{font-weight:700}
  html[data-type="makro"] .lbl,html[data-type="makro"] label,html[data-type="makro"] dt,html[data-type="makro"] dd,html[data-type="makro"] .info,html[data-type="makro"] .chk,html[data-type="makro"] .dic-row{font-size:16px}
  html[data-type="makro"] dd,html[data-type="makro"] .lbl{font-weight:700}
  html[data-type="makro"] .info .tag{font-size:11px;width:20px;height:20px}
  html[data-type="makro"] .alert{font-size:16px;line-height:24px}
  html[data-type="makro"] .alert svg{width:24px;height:24px}

  /* step list, step label */
  html[data-type="makro"] .step b{font-size:16px;font-weight:700}
  html[data-type="makro"] .step span{font-size:14px}
  html[data-type="makro"] .step .dot{font-size:14px}
  html[data-type="makro"] .topbar,html[data-type="makro"] .crumb{font-size:16px}
  html[data-type="makro"] .saved{font-size:14px}

  /* buttons and links */
  html[data-type="makro"] .btn,html[data-type="makro"] .btn-wide,html[data-type="makro"] .lp-pill{font-size:18px !important;line-height:27px;font-weight:700}
  html[data-type="makro"] .btn{padding:11px 16px}
  html[data-type="makro"] .btn.sm{font-size:15px !important;line-height:22px;padding:7px 12px !important}
  html[data-type="makro"] .actions .btn{padding:10px 16px !important}
  html[data-type="makro"] .link,html[data-type="makro"] .toggle{font-size:16px;font-weight:700}
  html[data-type="makro"] .link.small{font-size:14px}
  html[data-type="makro"] .btn-reg,html[data-type="makro"] .hdr-actions{font-size:16px}
  html[data-type="makro"] .btn-reg{padding:10px 14px}
  html[data-type="makro"] .lp-pill{padding:15px 28px}

  /* fields, tiles, tabs, uploads */
  html[data-type="makro"] .field{height:48px}
  html[data-type="makro"] .field input{font-size:16px}
  html[data-type="makro"] .ico-row .field{width:280px}
  html[data-type="makro"] .bank .name{font-size:18px;font-weight:700;line-height:24px}
  html[data-type="makro"] .seg button{font-size:14px;height:32px;min-width:132px;line-height:20px}
  html[data-type="makro"] .slot-h b{font-size:16px}
  html[data-type="makro"] .slot-h span,html[data-type="makro"] .slot-err{font-size:14px}
  html[data-type="makro"] .drop .t b{font-size:16px;font-weight:700}
  html[data-type="makro"] .drop small,html[data-type="makro"] .file,html[data-type="makro"] .file .sz{font-size:14px}
  html[data-type="makro"] .role{font-size:13px;padding:3px 8px}

  /* dialogs and registration modal */
  html[data-type="makro"] .dialog h2{font-size:24px;line-height:32px}
  html[data-type="makro"] .dialog p{font-size:16px;line-height:24px}
  html[data-type="makro"] .modal h2{font-size:22px}
  html[data-type="makro"] .modal p,html[data-type="makro"] .modal .have{font-size:14px}
  html[data-type="makro"] .modal .how,html[data-type="makro"] .or{font-size:13px}
  html[data-type="makro"] .bsite-card h1{font-size:28px;line-height:36px}
  html[data-type="makro"] .bsite-note,html[data-type="makro"] .bsite-env{font-size:16px}

  /* landing page */
  html[data-type="makro"] .lp-hero h1{font-size:64px;line-height:1.04;font-weight:900;color:#fff;margin-bottom:0}
  html[data-type="makro"] .lp-hero p.lead{font-size:20px;line-height:30px;color:rgba(255,255,255,.95)}
  html[data-type="makro"] .lp-eyebrow{font-size:14px}
  html[data-type="makro"] .lp-stat b{font-size:40px}
  html[data-type="makro"] .lp-stat span,html[data-type="makro"] .lp-card p{font-size:16px;line-height:24px}
  html[data-type="makro"] .lp-card h3{font-size:20px;line-height:26px}
  html[data-type="makro"] .lp-why h2{font-size:36px;line-height:44px}
  html[data-type="makro"] .lp-cta h2{font-size:30px;line-height:38px}
  html[data-type="makro"] .lp-cta p{font-size:18px;line-height:27px}
  html[data-type="makro"] .lp-foot{font-size:14px;line-height:22px}
  html[data-type="makro"] .lp-foot ul{gap:6px}

  @media (max-width:768px){
    html[data-type="makro"] h1{font-size:28px;line-height:36px}
    html[data-type="makro"] dl{grid-template-columns:1fr}
    html[data-type="makro"] .topbar .crumb{font-size:18px;line-height:24px}
    html[data-type="makro"] .topbar .saved{font-size:14px}
    html[data-type="makro"] .actions .btn,html[data-type="makro"] .actions .link{font-size:18px !important;min-height:52px}
    html[data-type="makro"] .rdot{font-size:14px}
    html[data-type="makro"] .lp-hero h1{font-size:40px}
    html[data-type="makro"] .lp-hero p.lead{font-size:18px;line-height:27px}
    html[data-type="makro"] .lp-why h2{font-size:30px;line-height:38px}
    html[data-type="makro"] .seg button{height:36px;min-width:0}
    html[data-type="makro"] .sheet .btn-wide{font-size:18px !important}
  }

  /* prototype controls */
  .proto{position:fixed;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:12px;width:230px;z-index:10}
  .proto summary{padding:8px 10px;font-weight:600;cursor:pointer;color:var(--muted)}
  .proto div{padding:4px 10px 10px;display:flex;flex-direction:column;gap:8px}
  .proto label{display:flex;flex-direction:column;gap:3px;color:var(--muted)}
  .proto select{font:inherit;padding:4px}
  @media (max-width:400px){.brand,.logo{font-size:22px}.btn-reg{padding:9px 10px;font-size:13px}}
  @media (max-width:768px){.proto{left:4px;right:auto;bottom:4px;width:200px;opacity:.92}}
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="exitOverlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="exitTitle" aria-describedby="exitText">
    <button class="x" id="exitX" aria-label="Zavřít">✕</button>
    <h2 id="exitTitle">Registraci jsme uložili</h2>
    <p id="exitText">Svůj postup neztratíte. Kdykoli se přihlaste a pokračujte tam, kde jste skončili.</p>
    <div class="actions"><button class="btn" id="exitContinue" style="padding:14px 12px">Pokračovat v registraci</button><button class="link" id="exitRestart">Začít znovu</button></div>
  </div>
</div>

<details class="proto" id="proto">
  <summary>Prototype scenarios</summary>
  <div>
    <label>Typography
      <select id="sc-type">
        <option value="default">Default (Figma, 14px base)</option>
        <option value="makro">makro.cz (larger text)</option>
      </select>
    </label>
    <label>Role verified (Bank iD / ID + photo)
      <select id="sc-role">
        <option value="auto">Statutory body (jednatel)</option>
        <option value="poa">Power of attorney needed</option>
      </select>
    </label>
    <label>Power of attorney check
      <select id="sc-poa">
        <option value="ok">Success</option>
        <option value="fail">Fail</option>
      </select>
    </label>
    <label>ID + photo check
      <select id="sc-doc">
        <option value="ok">Success</option>
        <option value="fail">Fail</option>
      </select>
    </label>
    <label>Jump to screen
      <select id="sc-jump"></select>
    </label>
  </div>
</details>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const timers = [];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
let firstPaint = true;

function go(id){
  timers.splice(0).forEach(clearTimeout);
  const prev = S.screen;
  if(id==='idOk'||id==='poaOk') S.idScreen = id;
  S.screen = id;
  if(location.hash.slice(1)!==id) history.replaceState(null,'','#'+id);
  const swap = () => { render(); window.scrollTo(0,0); };
  if(prev!==id && !firstPaint && document.startViewTransition && !REDUCED.matches) document.startViewTransition(swap);
  else if(prev!==id && !firstPaint && !REDUCED.matches){ swap(); const a=$('#app'); a.classList.remove('fade'); void a.offsetWidth; a.classList.add('fade'); }
  else swap();
  firstPaint = false;
  // auto transitions of loading screens
  if(id==='icoLoading') later(1600,()=>go(S.ico===VALID_ICO?'icoFound':'icoNotFound'));
  if(id==='docLoading') later(1800,()=>{
    if($('#sc-doc').value==='fail'){
      Object.values(S.docs).forEach(d=>d&&URL.revokeObjectURL(d.url));
      S.docs={front:null,back:null,selfie:null}; S.docConsent=false; S.docFail=true; go('bank');
    } else go($('#sc-role').value==='poa'?'poa':'idOk'); // same outcome as a Bank iD check
  });
  if(id==='bankLoading') later(1400,()=>go($('#sc-role').value==='poa'?'poa':'idOk'));
  if(id==='poaLoading') later(1800,()=>{
    if($('#sc-poa').value==='fail'){ S.file=null; S.poaFail=true; go('poa'); } else go('poaOk');
  });
}
let exitReturnFocus = null;
const EXIT_COPY = {
  // step 1: nothing has been saved yet
  confirm: { title:'Opravdu chcete ukončit online registraci?',
    text:'Váš postup se zatím neukládá. Pokud registraci ukončíte, budete ji muset začít znovu.',
    stay:'Pokračovat v registraci', leave:'Ukončit registraci' },
  // from step 2 on (user account created) progress is saved
  saved: { title:'Registraci jsme uložili',
    text:'Svůj postup neztratíte. Až se příště přihlásíte svým uživatelským účtem, budete pokračovat tam, kde jste skončili.',
    stay:'Pokračovat v registraci', leave:'Opustit registraci' }
};
let exitKind = 'confirm';
function openExit(){
  // nothing is saved until the user account exists: step 1 and the account-creation modal
  exitKind = (SCREENS[S.screen].step <= 1 || S.screen==='auth') ? 'confirm' : 'saved';
  const c = EXIT_COPY[exitKind];
  $('#exitTitle').textContent=c.title; $('#exitText').textContent=c.text;
  $('#exitContinue').textContent=c.stay; $('#exitRestart').textContent=c.leave;
  const o=$('#exitOverlay'); exitReturnFocus=document.activeElement;
  o.classList.add('open'); o.setAttribute('aria-hidden','false'); document.body.classList.add('noscroll');
  $('#exitContinue').focus();
}
function closeExit(){
  const o=$('#exitOverlay'); o.classList.remove('open'); o.setAttribute('aria-hidden','true'); document.body.classList.remove('noscroll');
  if(exitReturnFocus && document.contains(exitReturnFocus)) exitReturnFocus.focus();
}
function restart(){
  Object.values(S.docs).forEach(d=>d&&URL.revokeObjectURL(d.url));
  Object.assign(S,{method:'bankid',via:'bankid',docs:{front:null,back:null,selfie:null},docErr:{},docConsent:false,docFail:false,idScreen:null,ico:VALID_ICO,dic:'',email:'',phone:'',bank:null,bankAll:false,consent:false,file:null,poaFail:false,invites:[],showInvite:false,terms:false,authForm:false,authEmail:''});
  go('landing');
}
(function swipeToDismiss(){
  const d=$('#exitOverlay .dialog'); let y0=null, dy=0;
  d.addEventListener('touchstart',e=>{ if(!isMobile()) return; y0=e.touches[0].clientY; dy=0; d.style.transition='none'; },{passive:true});
  d.addEventListener('touchmove',e=>{ if(y0===null) return; dy=Math.max(0,e.touches[0].clientY-y0); d.style.transform=`translateY(${dy}px)`; },{passive:true});
  d.addEventListener('touchend',()=>{
    if(y0===null) return; y0=null; d.style.transition=''; d.style.transform='';
    if(dy>80) closeExit();
  });
})();
$('#exitContinue').addEventListener('click',closeExit);
$('#exitX').addEventListener('click',closeExit);
$('#exitRestart').addEventListener('click',()=>{
  closeExit();
  if(exitKind==='confirm') restart(); // nothing saved yet: discard and leave
  else go('landing');                 // progress is saved: just leave
});
$('#exitOverlay').addEventListener('mousedown',e=>{ if(e.target.id==='exitOverlay') closeExit(); });
document.addEventListener('keydown',e=>{
  if(!$('#exitOverlay').classList.contains('open')) return;
  if(e.key==='Escape') return closeExit();
  if(e.key==='Tab'){ // keep focus inside the dialog
    const f=[...$('#exitOverlay').querySelectorAll('button')]; const i=f.indexOf(document.activeElement);
    e.preventDefault(); f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus();
  }
});
function later(ms,fn){ timers.push(setTimeout(fn,ms)); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

const STEP_TARGET = n => ({1:'intro', 2:'account', 3:'icoFound', 4:S.idScreen||'idOk'})[n];
const sidebar = (cur, done) => `
  <nav class="steps" aria-label="Kroky registrace">${STEPS.map((s,i)=>{
    const n=i+1, st = done||n<cur?'done':n===cur?'active':'';
    const inner = `<div class="dot">${st==='done'?'✓':n}</div><div class="txt"><b>${s[0]}</b><span>${s[1]}</span></div>`;
    return st==='done'
      ? `<button type="button" class="step done" data-step-go="${STEP_TARGET(n)}" aria-label="Krok ${n}: ${s[0]} (dokončeno) – vrátit se">${inner}</button>`
      : `<div class="step ${st}"${st==='active'?' aria-current="step"':''}>${inner}</div>`;
  }).join('')}</nav>`;

// numbered rail shown instead of the sidebar on mobile; completed steps are tappable
const rail = cur => `<nav class="rail" aria-label="Kroky registrace">${STEPS.map((st,i)=>{
  const n=i+1, state = n<cur?'done':n===cur?'current':'todo';
  const conn = n<STEPS.length ? `<span class="conn ${n<cur?'on':''}"></span>` : '';
  const dot = state==='done'
    ? `<button type="button" class="rdot done" data-step-go="${STEP_TARGET(n)}" aria-label="Krok ${n}: ${st[0]} (dokončeno) – vrátit se">✓</button>`
    : `<span class="rdot ${state}"${state==='current'?' aria-current="step"':''}>${n}</span>`;
  return dot+conn;
}).join('')}</nav>`;

/* ---------- render + events ---------- */
function render(){
  $('#app').innerHTML = VIEWS[S.screen]();
  document.title = 'makro distribuce – ' + SCREENS[S.screen].label;
  $('#sc-jump').value = S.screen;
  wire();
}

function wire(){
  const app = $('#app');
  app.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',e=>{
    e.preventDefault();
    const t = el.dataset.go;
    if(t==='later') return openExit();
    if(t==='auth') S.authForm=false;
    go(t);
  }));
  app.querySelectorAll('[data-step-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.stepGo)));
  app.querySelectorAll('[data-back]').forEach(el=>el.addEventListener('click',()=>{
    if(SCREENS[S.screen].step<=1) return openExit(); // step 1: back = exit flow
    const b = SCREENS[S.screen].back || 'intro';
    if(b==='ico'){ S.icoErr=false; }
    go(b);
  }));
  app.querySelectorAll('[data-restart]').forEach(el=>el.addEventListener('click',restart));
  app.querySelectorAll('[data-soon]').forEach(el=>el.addEventListener('click',()=>toast('Ověření dostupnosti rozvozu není součástí tohoto prototypu.')));
  app.querySelectorAll('[data-poa-sample]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();toast('Vzor plné moci by se zde stáhl (v prototypu nedostupné).');}));
  app.querySelectorAll('[data-preview]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();toast('Náhled souboru není v prototypu k dispozici.');}));
  app.querySelectorAll('a[href="#"]:not([data-go]):not([data-poa-sample]):not([data-preview]):not([data-auth-login])').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
  app.querySelectorAll('[data-bind]').forEach(el=>el.addEventListener('input',()=>{ S[el.dataset.bind]=el.value; }));

  // auth modal
  const sov = app.querySelector('.sheet-ov');
  if(sov) sov.addEventListener('click',e=>{ if(e.target===sov) openExit(); }); // tap outside the sheet
  const am = app.querySelector('[data-auth-mail]');
  if(am) am.addEventListener('click',()=>{ S.authForm=true; render(); $('#aemail')?.focus(); });
  const al = app.querySelector('[data-auth-login]');
  if(al) al.addEventListener('click',e=>{ e.preventDefault(); S.authEmail=PERSON.email; go('account'); });
  const af = $('#authForm');
  if(af) af.addEventListener('submit',e=>{ e.preventDefault(); S.authEmail=$('#aemail').value.trim(); go('account'); });
  app.querySelectorAll('[data-social]').forEach(b=>b.addEventListener('click',()=>{ S.authEmail=PERSON.email; go('account'); }));

  // ICO
  const ico = $('#ico');
  if(ico){
    ico.addEventListener('input',()=>{ ico.value=ico.value.replace(/\D/g,''); S.ico=ico.value; });
    ico.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyIco(); });
    $('#icoVerify').addEventListener('click',verifyIco);
    app.querySelector('[data-clear]').addEventListener('click',()=>{ S.ico=''; ico.value=''; ico.focus(); });
  }

  // verification method tabs (Bank iD / Osobní doklad)
  const tablist = app.querySelector('[role="tablist"]');
  if(tablist){
    const pick = m => { S.method=m; render(); app.querySelector('[role="tab"][aria-selected="true"]').focus(); };
    tablist.querySelectorAll('[role="tab"]').forEach(t=>t.addEventListener('click',()=>pick(t.dataset.method)));
    tablist.addEventListener('keydown',e=>{
      if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) return;
      e.preventDefault(); pick(S.method==='bankid'?'doc':'bankid');
    });
  }
  // ID document + photo slots
  app.querySelectorAll('[data-doc-pick]').forEach(b=>b.addEventListener('click',()=>b.parentElement.querySelector('input[type=file]').click()));
  app.querySelectorAll('[data-doc-input]').forEach(i=>i.addEventListener('change',()=>setDoc(i.dataset.docInput,i.files[0])));
  app.querySelectorAll('[data-doc-drop]').forEach(d=>{
    ['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over');}));
    ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over');}));
    d.addEventListener('drop',e=>setDoc(d.dataset.docDrop,e.dataTransfer.files[0]));
  });
  app.querySelectorAll('[data-doc-remove]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.docRemove; URL.revokeObjectURL(S.docs[k].url); S.docs[k]=null; render();
  }));
  const dc = $('#docConsent');
  if(dc) dc.addEventListener('change',()=>{ S.docConsent=dc.checked; $('#docGo').disabled=!(S.docs.front&&S.docs.back&&S.docs.selfie&&S.docConsent); });
  const dg = $('#docGo');
  if(dg) dg.addEventListener('click',()=>{ S.via='doc'; S.docFail=false; go('docLoading'); });

  // bank
  app.querySelectorAll('[data-bank]').forEach(b=>b.addEventListener('click',()=>{ S.bank=b.dataset.bank; render(); }));
  const tb = app.querySelector('[data-toggle-banks]');
  if(tb) tb.addEventListener('click',()=>{ S.bankAll=!S.bankAll; render(); });
  const cons = $('#consent');
  if(cons) cons.addEventListener('change',()=>{ S.consent=cons.checked; $('#bankGo').disabled=!(S.bank&&S.consent); });
  const bg = $('#bankGo');
  if(bg) bg.addEventListener('click',()=>{ S.via='bankid'; S.docFail=false; go('bankSite'); });

  const bv = $('#bsVerify');
  if(bv) bv.addEventListener('click',()=>go('bankLoading'));

  // POA
  const pick = $('#pick');
  if(pick){
    const fi=$('#fileIn'), drop=$('#drop');
    pick.addEventListener('click',()=>fi.click());
    fi.addEventListener('change',()=>setFile(fi.files[0]));
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
    drop.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));
  }
  const pg = $('#poaGo');
  if(pg) pg.addEventListener('click',()=>{ S.poaFail=false; go('poaLoading'); });

  // summary
  const au = $('#addUser');
  if(au) au.addEventListener('click',()=>{
    if(!S.showInvite){ S.showInvite=true; S.invites=['']; } else S.invites.push('');
    render(); app.querySelector(`[data-invite="${S.invites.length-1}"]`)?.focus();
  });
  app.querySelectorAll('[data-invite]').forEach(el=>el.addEventListener('input',()=>{ S.invites[+el.dataset.invite]=el.value.trim(); }));
  const tm = $('#terms');
  if(tm) tm.addEventListener('change',()=>{ S.terms=tm.checked; $('#finish').disabled=!S.terms; });
  const fin = $('#finish');
  if(fin) fin.addEventListener('click',()=>go('done'));
}

function verifyIco(){
  if(S.ico.length!==8){ S.icoErr=true; return go('icoNotFound'); }
  go('icoLoading');
}
function setDoc(key,f){
  if(!f) return;
  const ok = /\.(jpe?g|png)$/i.test(f.name) && /^image\/(jpeg|png)$/.test(f.type||'image/png') && f.size <= 10*1048576;
  if(!ok){ S.docErr[key]='Soubor musí být obrázek JPG nebo PNG a nesmí být větší než 10 MB.'; render(); return; }
  S.docErr[key]=null; S.docFail=false;
  S.docs[key]={name:f.name,size:f.size,url:URL.createObjectURL(f)};
  render();
}
function setFile(f){
  if(!f) return;
  const ok = /\.(jpe?g|png|pdf)$/i.test(f.name) && f.size <= 10*1048576;
  if(!ok){ const e=$('#fileErr'); if(e) e.textContent='Soubor musí být JPG, PNG nebo PDF a nesmí být větší než 10 MB.'; return; }
  S.file = {name:f.name,size:f.size}; S.poaFail=false; render();
}

matchMedia('(max-width:768px)').addEventListener('change',()=>render());

/* typography theme: default (Figma) or makro.cz; remembered in localStorage when available, ?type=makro also works */
function applyType(t){
  document.documentElement.dataset.type = t;
  $('#sc-type').value = t;
  try{ localStorage.setItem('fsd-type',t); }catch(e){}
}
$('#sc-type').addEventListener('change',e=>applyType(e.target.value));
(function initType(){
  let t = new URLSearchParams(location.search).get('type');
  if(!t){ try{ t = localStorage.getItem('fsd-type'); }catch(e){} }
  applyType(t==='makro' ? 'makro' : 'default');
})();

/* prototype panel */
$('#sc-jump').innerHTML = Object.entries(SCREENS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
$('#sc-jump').addEventListener('change',e=>{
  const id=e.target.value;
  // make jumped-to screens renderable with sensible data
  if(id==='ico'||id==='icoNotFound') S.ico = id==='ico'?VALID_ICO:S.ico;
  if(id==='poa' && !S.file) S.file=null;
  go(id);
});
const start = location.hash.slice(1);
go(SCREENS[start]?start:'landing');
</script>
</body>
